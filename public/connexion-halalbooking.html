<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TravelMuz — Vérification Halalbooking</title><link rel="stylesheet" href="/style.css"><body><main style="max-width:980px;margin:60px auto;padding:24px"><a href="/">← Comparateur</a><h1>Connexion Halalbooking</h1><p>Test privé · Deluxe Golden Horn Sultanahmet · 4–7 mars 2027 · 2 adultes · 1 chambre · pays client France</p><p>Consultation réelle à la demande. Aucune réservation. Prix fournisseur en EUR, net agence et frais restant à qualifier.</p><button id="run">Tester la recherche réelle</button><p id="status" role="status">Prêt à tester.</p><pre id="result" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre><script type="module">
const button=document.querySelector('#run'),status=document.querySelector('#status'),result=document.querySelector('#result');button.addEventListener('click',async()=>{button.disabled=true;status.textContent='Recherche en cours…';result.textContent='';try{const response=await fetch('/api/halalbooking/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({hotelId:4,checkin:'2027-03-04',checkout:'2027-03-07',adults:2,country:'FR'})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Erreur serveur');status.textContent=`Connexion réussie — ${data.offers.length} tarifs reçus — ${new Date(data.observedAt).toLocaleString('fr-FR')}`;result.textContent=data.offers.slice(0,3).map(o=>`${o.room}\n${o.price} ${o.currency} · ${o.meal??'Pension non renseignée'}\nConditions : ${JSON.stringify(o.cancellation??'Non renseignées')}`).join('\n\n');}catch(e){status.textContent='Échec du test : '+e.message;}finally{button.disabled=false;}});
</script></main><script type="module" src="/session.mjs"></script></body></html>
